<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .attendance-card {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        #video {
            border-radius: 10px;
            border: 2px solid #0d6efd;
        }
        #markBtn {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="attendance-card">
        <h2 class="mb-4 text-primary">Mark Your Attendance</h2>
        <video id="video" width="400" height="300" autoplay></video>
        <br>
        <button id="markBtn" class="btn btn-primary btn-lg">Mark Attendance</button>
        <p id="status" class="mt-3"></p>
    </div>

    <!-- Attendance Modal -->
    <div class="modal fade" id="attendanceModal" tabindex="-1" aria-labelledby="attendanceModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
          <div class="modal-header">
            <h5 class="modal-title" id="attendanceModalLabel">Attendance Status</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="modalMessage" style="font-size: 1.2rem;">
            <!-- Message will be inserted here -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-success" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS & dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const attendanceModal = new bootstrap.Modal(document.getElementById('attendanceModal'));
        const modalMessage = document.getElementById('modalMessage');

        // Access webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { 
                status.innerText = "Cannot access camera"; 
                status.classList.add('text-danger');
            });

        document.getElementById('markBtn').addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');

                fetch('/recognize_face', { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => {
                        if(data.recognized) {
                            modalMessage.innerHTML = `<span class="text-success fw-bold">Attendance marked for:</span> <br>${data.name}`;
                        } else {
                            modalMessage.innerHTML = `<span class="text-danger fw-bold">Face not recognized</span>`;
                        }
                        attendanceModal.show();
                    })
                    .catch(err => {
                        modalMessage.innerHTML = `<span class="text-danger fw-bold">Error:</span> ${err}`;
                        attendanceModal.show();
                    });
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
